name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    # Daily at 08:25 Beijing time.
    - cron: '25 0 * * *'

permissions: {}

jobs:
  sync:
    if: github.repository == 'Ferrghini-4664/epic-freebies-helper' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: sync-upstream-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configure merge author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Merge upstream without force pushing
        shell: python
        run: |
          import subprocess

          def git(*args, check=True):
              return subprocess.run(['git', *args], check=check).returncode

          def sync(upstream, branch):
              git('fetch', '--no-tags', upstream, 'refs/heads/master')
              if git('merge-base', '--is-ancestor', 'FETCH_HEAD', 'HEAD', check=False) == 0:
                  print('Already synchronized')
                  return
              if git('merge', '--no-ff', '--no-commit', 'FETCH_HEAD', check=False):
                  git('merge', '--abort', check=False)
                  raise SystemExit('Upstream merge failed; remote branch preserved')
              if git('diff', '--cached', '--quiet', '--', '.github/workflows', check=False):
                  git('merge', '--abort')
                  raise SystemExit('Upstream workflow changes require review; remote branch preserved')
              git('commit', '-m', 'Merge upstream master')
              git('push', 'origin', f'HEAD:refs/heads/{branch}')

          sync('https://github.com/Ronchy2000/epic-freebies-helper.git', 'master')
